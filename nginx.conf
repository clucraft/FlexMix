server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript text/javascript application/json
               application/manifest+json image/svg+xml;

    # Used by the Docker HEALTHCHECK.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Files aren't fingerprinted (no build step), so make browsers revalidate
    # every time. Unchanged files come back as a cheap 304 via ETag.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # nginx's stock mime.types doesn't know .webmanifest.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
    }

    # The icon rarely changes; let it cache for a week.
    location = /icon.svg {
        add_header Cache-Control "public, max-age=604800" always;
    }
}
